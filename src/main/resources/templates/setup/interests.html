<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('관심사')}"></head>
<body class="min-h-screen min-h-[100dvh] bg-white flex flex-col">
<header class="sticky top-0 z-10 bg-white border-b-2 border-primary px-4 py-3 flex items-center justify-between">
  <a href="/setup/hand" class="w-10 h-10 flex items-center justify-center text-primary rounded-full hover:bg-surface" aria-label="닫기">✕</a>
  <button type="button" id="headerDone" class="w-10 h-10 flex items-center justify-center text-primary rounded-full hover:bg-surface font-medium" aria-label="완료">✓</button>
</header>
<div class="app-shell flex-1 p-4 max-w-md mx-auto w-full pb-8">
  <h1 class="text-2xl font-semibold text-primary">관심사 (선택사항)</h1>
  <p class="text-primary font-medium mt-1 text-sm"><span id="selCount">0</span>/<span th:text="${maxSelection}">7</span></p>
  <p class="text-gray-600 text-sm mt-2">프로필에 최대 7개의 관심사를 추가 하세요</p>
  <p th:if="${error}" class="text-red-500 text-sm mt-2" th:text="${error}"></p>
  <div class="mt-4">
    <div class="flex items-center gap-2 px-4 py-2.5 bg-surface rounded-button border-2 border-primary/10">
      <span class="text-gray-500 text-lg">🔍</span>
      <input type="search" id="interestSearch" placeholder="검색" class="flex-1 bg-transparent text-primary placeholder-gray-400 text-sm outline-none"/>
    </div>
  </div>
  <form th:action="@{/setup/interests}" method="post" id="interestForm" class="mt-6 space-y-6">
    <th:block th:each="cat : ${categories}">
      <section class="interest-section" th:attr="data-section-title=${cat.title}">
        <div class="flex items-center gap-2 mb-3">
          <span class="text-xl" th:text="${cat.icon}">☀️</span>
          <h2 class="text-base font-semibold text-primary" th:text="${cat.title}">카테고리</h2>
        </div>
        <div class="flex flex-wrap gap-2 tag-row">
          <label th:each="tag : ${cat.tags}" class="interest-tag inline-flex cursor-pointer"
                 th:attr="data-tag=${#strings.toLowerCase(tag)}">
            <input type="checkbox" name="interests" th:value="${tag}" class="sr-only interest-cb"/>
            <span class="interest-pill px-4 py-2 rounded-full text-sm font-medium border-2 border-primary/20 bg-white text-primary hover:border-primary/40"
                  th:text="${tag}">태그</span>
          </label>
        </div>
      </section>
    </th:block>
    <button type="submit" class="w-full py-3.5 bg-primary text-white rounded-button font-medium mt-8">완료</button>
  </form>
</div>
<style>
  .interest-cb:checked + .interest-pill {
    background-color: #111111;
    color: #ffffff;
    border-color: #111111;
  }
</style>
<script th:inline="javascript">
  (function () {
    var max = /*[[${maxSelection}]]*/ 7;
    var form = document.getElementById('interestForm');
    var countEl = document.getElementById('selCount');
    var search = document.getElementById('interestSearch');
    function updateCount() {
      countEl.textContent = String(document.querySelectorAll('.interest-cb:checked').length);
    }
    document.querySelectorAll('.interest-cb').forEach(function (cb) {
      cb.addEventListener('change', function (e) {
        var n = document.querySelectorAll('.interest-cb:checked').length;
        if (n > max) {
          e.target.checked = false;
          alert('최대 ' + max + '개까지 선택할 수 있어요.');
        }
        updateCount();
      });
    });
    document.querySelectorAll('.interest-tag').forEach(function (lab) {
      lab.addEventListener('click', function () {
        setTimeout(updateCount, 0);
      });
    });
    updateCount();
    document.getElementById('headerDone').addEventListener('click', function () { form.requestSubmit(); });
    search.addEventListener('input', function () {
      var q = (search.value || '').trim().toLowerCase();
      document.querySelectorAll('.interest-section').forEach(function (sec) {
        var any = false;
        sec.querySelectorAll('.interest-tag').forEach(function (tagEl) {
          var key = (tagEl.getAttribute('data-tag') || '');
          var show = !q || key.indexOf(q) !== -1;
          tagEl.classList.toggle('hidden', !show);
          if (show) any = true;
        });
        sec.classList.toggle('hidden', !any);
      });
    });
  })();
</script>
</body>
</html>
