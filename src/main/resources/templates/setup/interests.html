<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 관심사')}"></head>
<body>
<div class="app-root">
  <div class="min-h-screen bg-white flex flex-col" style="display:flex;flex-direction:column">
    <header class="page-header" style="justify-content:space-between">
      <button type="button" onclick="HideApp.goBack()" style="width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;color:var(--color-primary);border-radius:9999px;background:none;border:none;cursor:pointer" aria-label="닫기">✕</button>
      <button type="button" id="doneHeaderBtn" style="width:2.5rem;height:2.5rem;display:flex;align-items:center;justify-content:center;color:var(--color-primary);border-radius:9999px;background:none;border:none;cursor:pointer;font-weight:500" aria-label="완료">✓</button>
    </header>
    <div class="flex-1 p-4 max-w-md mx-auto w-full" style="padding-bottom:2rem">
      <h1 class="text-2xl font-semibold text-primary">관심사 (선택사항)</h1>
      <p id="counter" class="text-primary font-medium mt-1 text-sm">0/7</p>
      <p class="text-gray-600 text-sm mt-2">프로필에 최대 7개의 관심사를 추가 하세요</p>
      <div class="mt-4">
        <div style="display:flex;align-items:center;gap:0.5rem;padding:0.625rem 1rem;background:var(--color-surface);border-radius:var(--radius-button);border:2px solid rgba(17,17,17,0.1)">
          <span class="text-gray-500 text-lg">🔍</span>
          <input type="text" id="searchInput" placeholder="검색" style="flex:1;background:transparent;border:none;outline:none;color:var(--color-primary);font-size:0.875rem;font-family:inherit" class="text-primary">
        </div>
      </div>
      <div id="categoriesContainer" class="mt-6 space-y-6"></div>
      <button type="button" id="doneBtn" class="btn btn-primary mt-8">완료</button>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
(function(){
  var MAX = 7, selected = [];
  var cats = HideMock.interestCategories;
  var container = document.getElementById('categoriesContainer');
  var counter = document.getElementById('counter');

  function render(filter) {
    container.innerHTML = '';
    var q = (filter || '').trim().toLowerCase();
    cats.forEach(function(cat) {
      var tags = q ? cat.tags.filter(function(t){ return t.toLowerCase().indexOf(q) >= 0; }) : cat.tags;
      if (tags.length === 0) return;
      var section = document.createElement('section');
      var header = document.createElement('div');
      header.style.cssText = 'display:flex;align-items:center;gap:0.5rem;margin-bottom:0.75rem';
      header.innerHTML = '<span style="font-size:1.25rem">' + cat.icon + '</span><h2 class="text-base font-semibold text-primary">' + cat.title + '</h2>';
      section.appendChild(header);
      var wrap = document.createElement('div');
      wrap.style.cssText = 'display:flex;flex-wrap:wrap;gap:0.5rem';
      tags.forEach(function(tag) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = tag;
        btn.className = 'tag-lg' + (selected.indexOf(tag) >= 0 ? ' selected' : '');
        btn.addEventListener('click', function() { toggle(tag); });
        wrap.appendChild(btn);
      });
      section.appendChild(wrap);
      container.appendChild(section);
    });
    counter.textContent = selected.length + '/' + MAX;
  }

  function toggle(tag) {
    var idx = selected.indexOf(tag);
    if (idx >= 0) selected.splice(idx, 1);
    else if (selected.length < MAX) selected.push(tag);
    render(document.getElementById('searchInput').value);
  }

  function complete() {
    HideApp.completeOnboarding();
    HideApp.completeSetup();
    location.href = '/';
  }

  document.getElementById('searchInput').addEventListener('input', function() { render(this.value); });
  document.getElementById('doneBtn').addEventListener('click', complete);
  document.getElementById('doneHeaderBtn').addEventListener('click', complete);
  render();
})();
</script>
</body>
</html>
