<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 손 인증')}"></head>
<body>
<div class="app-root">
  <div class="min-h-screen bg-white flex flex-col p-6" style="display:flex;flex-direction:column">
    <button type="button" onclick="HideApp.goBack()" class="back-btn self-start" aria-label="뒤로">←</button>
    <div class="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full">
      <h1 class="text-2xl font-semibold text-primary">손 인증</h1>
      <div class="text-gray-600 mt-2 text-sm leading-relaxed">
        <p>신뢰할 수 있는 커뮤니티를 위해 간단한 손 사진 인증을 진행합니다.</p>
        <p>촬영한 손 사진은 프로필에 함께 표시됩니다.</p>
        <p class="text-gray-500 text-xs" style="margin-top:0.75rem">(손 이외에 다른 신체 부위가 나올 경우 인증이 안 됩니다)</p>
      </div>
      <form id="handForm" class="mt-8 space-y-6">
        <div style="border-radius:var(--radius-card);border:2px dashed rgba(17,17,17,0.3);padding:2rem;text-align:center;background:rgba(245,245,245,0.5)">
          <img id="handPreview" src="" alt="손 사진 미리보기" style="display:none;width:100%;max-height:12rem;object-fit:contain;border-radius:0.5rem;margin:0 auto">
          <p id="handPlaceholder" class="text-gray-500 text-sm">자신의 손 사진을 찍어주세요</p>
          <label class="btn btn-primary" style="margin-top:1rem;display:inline-block;padding:0.75rem 1.5rem;width:auto;font-size:0.875rem;cursor:pointer">
            사진 찍기
            <input type="file" accept="image/*" capture="user" id="handInput" style="display:none">
          </label>
        </div>
        <button type="submit" class="btn btn-primary">인증 완료</button>
      </form>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
document.getElementById('handInput').addEventListener('change', function(e) {
  var file = e.target.files && e.target.files[0];
  if (file) {
    var preview = document.getElementById('handPreview');
    preview.src = URL.createObjectURL(file);
    preview.style.display = 'block';
    document.getElementById('handPlaceholder').style.display = 'none';
  }
});
document.getElementById('handForm').addEventListener('submit', function(e) {
  e.preventDefault();
  location.href = '/setup/interests';
});
</script>
</body>
</html>
