<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 아바타 만들기')}"></head>
<body>
<div class="app-root">
  <!-- upload step -->
  <div id="stepUpload" class="min-h-screen bg-white flex flex-col p-6" style="display:flex;flex-direction:column">
    <button type="button" onclick="HideApp.goBack()" class="back-btn self-start" aria-label="뒤로">←</button>
    <div class="flex-1 max-w-sm mx-auto w-full flex flex-col justify-center">
      <h1 class="text-2xl font-semibold text-primary">내 아바타 만들기</h1>
      <p class="text-gray-600 mt-1 text-sm">사진을 업로드 하면 AI가 아바타를 만들어 드려요</p>
      <p class="text-gray-500 text-xs" style="margin-top:0.125rem">(아바타 제작 후 사진은 자동 삭제 됩니다)</p>
      <div class="mt-8">
        <div style="border-radius:var(--radius-card);border:2px dashed rgba(17,17,17,0.3);padding:2rem;text-align:center;background:rgba(245,245,245,0.5)">
          <p class="text-gray-500 text-sm">얼굴 사진을 업로드해 주세요</p>
          <label class="btn" style="margin-top:1rem;display:inline-block;padding:0.5rem 1rem;background:var(--color-surface);color:var(--color-primary);font-size:0.875rem;cursor:pointer;border-radius:var(--radius-button)">
            사진 선택
            <input type="file" accept="image/*" id="photoInput" style="display:none">
          </label>
        </div>
      </div>
    </div>
  </div>
  <!-- loading step -->
  <div id="stepLoading" class="min-h-screen bg-white flex flex-col items-center justify-center p-6" style="display:none">
    <div class="spinner"></div>
    <p class="text-primary font-medium mt-6">아바타를 생성하고 있어요</p>
    <p class="text-gray-500 text-sm mt-1">잠시만 기다려 주세요</p>
  </div>
  <!-- result step -->
  <div id="stepResult" class="min-h-screen bg-white flex flex-col p-6" style="display:none">
    <div class="flex-1 flex flex-col items-center justify-center max-w-sm mx-auto w-full">
      <p class="text-primary font-semibold text-lg mb-4">당신의 아바타입니다</p>
      <div style="border-radius:var(--radius-card);background:var(--color-surface);border:2px solid rgba(17,17,17,0.1);width:100%;aspect-ratio:1;max-width:280px;display:flex;align-items:center;justify-content:center">
        <span class="text-8xl">👤</span>
      </div>
      <p class="text-gray-600 text-sm mt-4 text-center">남들에게 보여질 때 이상형 부합도가 <span class="font-semibold text-primary">85%~95%</span> 사이로 보여져요</p>
      <button type="button" onclick="location.href='/setup/hand'" class="btn btn-primary" style="margin-top:2.5rem">다음</button>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
document.getElementById('photoInput').addEventListener('change', function(e) {
  if (e.target.files && e.target.files[0]) {
    document.getElementById('stepUpload').style.display = 'none';
    document.getElementById('stepLoading').style.display = 'flex';
    setTimeout(function() {
      document.getElementById('stepLoading').style.display = 'none';
      document.getElementById('stepResult').style.display = 'flex';
    }, 2500);
  }
});
</script>
</body>
</html>
