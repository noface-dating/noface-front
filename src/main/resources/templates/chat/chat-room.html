  <!DOCTYPE html>
  <html lang="ko" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat Room</title>

    <style>
      * { box-sizing:border-box; margin:0; padding:0; font-family:'Arial', sans-serif; }
      body { background:#fafafa; display:flex; justify-content:center; align-items:center; height:100vh; }

      .chat-container {
        position:relative;
        width:400px; height:600px;
        border:1px solid #ccc; border-radius:10px;
        display:flex; flex-direction:column;
        background:#fff; overflow:hidden;
        box-shadow:0 4px 10px rgba(0,0,0,0.1);
      }

      .chat-header {
        padding:10px 15px;
        border-bottom:1px solid #eee;
        font-weight:bold;
        display:flex;
        align-items:center;
        gap:10px;
      }

      .back-btn { cursor:pointer; font-size:20px; border:none; background:none; }

      .chat-messages {
        flex:1;
        padding:10px 15px;
        display:flex;
        flex-direction:column;
        gap:8px;
        overflow-y:auto;
        background:#7a7a7a;
        position:relative;
      }

      .message-wrapper {
        display:flex;
        align-items:flex-end;
        gap:6px;
      }

      .message-wrapper.sent { flex-direction:row-reverse; }
      .message-wrapper.received { flex-direction:row; }

      .profile {
        width:32px; height:32px;
        border-radius:50%;
        overflow:hidden;
        background:#ccc;
      }

      .profile img { width:100%; height:100%; object-fit:cover; }

      .message {
        max-width:70%;
        padding:8px 12px;
        border-radius:20px;
        font-size:14px;
        display:flex;
        flex-direction:column;
        gap:2px;
      }

      .message.sent {
        background:#fff;
        border-bottom-right-radius:4px;
      }

      .message.received {
        background:#b2b5b8;
        border-bottom-left-radius:4px;
      }

      .message-time {
        font-size:11px;
        color:#777;
        align-self:flex-end;
      }

      .chat-input {
        display:flex;
        padding:8px 10px;
        border-top:1px solid #eee;
        background:#fff;
        position:relative;
      }

      .chat-input input {
        flex:1;
        padding:8px 12px;
        border-radius:20px;
        border:1px solid #ccc;
      }

      .send-btn {
        margin-left:6px;
        border:none;
        background:none;
        font-size:20px;
        cursor:pointer;
        color:#007aff;
      }

      .plus-btn {
        font-size:24px;
        cursor:pointer;
        border:none;
        background:none;
        margin-right:6px;
        transition: transform 0.3s ease;
      }

      .plus-btn.toggled {
        transform: rotate(45deg);
      }

      .attachments {
        position:absolute;
        bottom: 95%;
        left:10px;
        margin-bottom:10px;
        display:flex;
        gap:6px;
        opacity:0;
        pointer-events:none;
        transition: all 0.3s ease;
      }

      .attachments.active {
        opacity:1;
        pointer-events:auto;
      }

      .attachments button {
        font-size:20px;
        border:none;
        border-radius:50%;
        width:40px;
        height:40px;
        cursor:pointer;
        display:flex;
        justify-content:center;
        align-items:center;
        background:#f0f0f0;
        color:#333;
        box-shadow:0 2px 5px rgba(0,0,0,0.1);
        transform: translateY(20px);
        opacity:0;
        transition: all 0.3s ease;
      }

      .attachments.active button {
        transform: translateY(0);
        opacity:1;
      }

      .attachments button:hover {
        transform: scale(1.1);
      }

      .new-message-notice {
        position:absolute;
        bottom:60px;
        left:50%;
        transform:translateX(-50%);
        background:#007aff;
        color:#fff;
        padding:5px 12px;
        border-radius:20px;
        font-size:13px;
        display:none;
        cursor:pointer;
      }

      .date-separator {
        text-align:center;
        margin:15px 0;
        font-size:12px;
        color:#eee;
      }

    </style>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
  </head>

  <body>

  <div class="chat-container">
    <div class="chat-header">
      <button class="back-btn" onclick="history.back()">←</button>
      <span>채팅방</span>
    </div>

    <div class="chat-messages" id="chatMessages">
      <th:block th:each="group, iterStat : ${messages}">

        <!-- 메시지 -->
        <th:block th:each="msg, stat : ${group.messages}">
          <div class="message-wrapper"
               th:data-before-created-at="${stat.index == 0 ? msg.createdAt : null}"
               th:data-timestamp="${#temporals.format(msg.timestamp, 'yyyy-MM-dd''T''HH:mm:ss')}"
               th:classappend="${msg.senderId == userId} ? ' sent' : ' received'">

            <!-- 프로필 -->
            <div class="profile" th:if="${msg.senderId != userId}">
              <img src="https://picsum.photos/32/32" alt="profile">
            </div>

            <!-- 메시지 -->
            <div class="message"
                 th:classappend="${msg.senderId == userId} ? ' sent' : ' received'">

              <!-- 닉네임 -->
              <div th:if="${msg.senderId != userId}"
                   style="font-size:11px; color:#555;"
                   th:text="${msg.senderNickname}">
              </div>

              <!-- 본문 -->
              <span th:text="${msg.content}"></span>

              <!-- 시간 -->
              <span class="message-time" th:text="${#temporals.format(msg.timestamp, 'a hh:mm')}"></span>
            </div>
          </div>
        </th:block>
      </th:block>
    </div>

    <div class="new-message-notice" id="newMessageNotice">새 메시지 도착</div>

    <div class="chat-input">
      <button class="plus-btn" id="plusBtn">+</button>
        <div class="attachments" id="attachments">
          <button class="photo" title="사진">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-image">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <circle cx="8.5" cy="8.5" r="1.5"></circle>
              <polyline points="21 15 16 10 5 21"></polyline>
            </svg>
          </button>
          <button class="video" title="영상">
            <svg xmlns="http://www.w3.org/2000/svg"
                 width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-video">
              <polygon points="23 7 16 12 23 17 23 7"></polygon>
              <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
            </svg>
          </button>
          </div>
      <input type="text" id="messageInput" placeholder="메시지 입력...">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

  <script th:inline="javascript">
    const ROOM_ID = /*[[${roomId}]]*/ null;
    const MY_USER_ID = /*[[${userId}]]*/ null;
  </script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const chatMessages = document.getElementById('chatMessages');
      const messageInput = document.getElementById('messageInput');
      const sendBtn = document.getElementById('sendBtn');
      const plusBtn = document.getElementById('plusBtn');
      const attachments = document.getElementById('attachments');
      const newMessageNotice = document.getElementById('newMessageNotice');

      let stompClient = null;
      let isAtBottom = true;
      let loadingOlder = false;
      let hasNext = true;

      chatMessages.scrollTop = chatMessages.scrollHeight;

      // =======================
      // 날짜 관련 헬퍼 함수
      // =======================
      const formatTime = (date) => {
        const hours = date.getHours();
        const minutes = date.getMinutes().toString().padStart(2, '0');
        const period = hours < 12 ? '오전' : '오후';
        const hour12 = hours % 12 === 0 ? 12 : hours % 12;
        return `${period} ${hour12.toString().padStart(2,'0')}:${minutes}`;
      };

      const isDifferentDate = (d1, d2) =>
              d1.getFullYear() !== d2.getFullYear() ||
              d1.getMonth() !== d2.getMonth() ||
              d1.getDate() !== d2.getDate();

      const createDateSeparator = (dateObj) => {
        const separator = document.createElement('div');
        separator.classList.add('date-separator');
        const year = dateObj.getFullYear();
        const month = (dateObj.getMonth() + 1).toString().padStart(2,'0');
        const day = dateObj.getDate().toString().padStart(2,'0');
        separator.textContent = `${year}년 ${month}월 ${day}일`;
        separator.dataset.date = `${year}-${month}-${day}`;
        return separator;
      };

      // =======================
      // 메시지 생성
      // =======================
      const createMessageElement = (msg) => {
        const wrapper = document.createElement('div');
        wrapper.classList.add('message-wrapper', msg.senderId === MY_USER_ID ? 'sent' : 'received');
        wrapper.dataset.beforeCreatedAt = msg.createdAt;
        wrapper.dataset.timestamp = msg.timestamp;

        if (msg.senderId !== MY_USER_ID) {
          const profile = document.createElement('div');
          profile.classList.add('profile');
          const img = document.createElement('img');
          img.src = 'https://picsum.photos/32/32';
          profile.appendChild(img);
          wrapper.appendChild(profile);
        }

        const message = document.createElement('div');
        message.classList.add('message', msg.senderId === MY_USER_ID ? 'sent' : 'received');

        if (msg.senderId !== MY_USER_ID) {
          const nickname = document.createElement('div');
          nickname.style.fontSize = '11px';
          nickname.style.color = '#555';
          nickname.textContent = msg.senderNickname;
          message.appendChild(nickname);
        }

        const content = document.createElement('span');
        content.textContent = msg.content;

        const time = document.createElement('span');
        time.classList.add('message-time');
        time.textContent = formatTime(new Date(msg.timestamp));

        message.append(content, time);
        wrapper.appendChild(message);
        return wrapper;
      };

      // =======================
      // 그룹 단위 prepend
      // =======================
      let tempOldestGroupDate = null; // 초기 로드 후 가장 오래된 그룹 날짜 저장
      const prependGroup = (group) => {
        if (!group || !Array.isArray(group.messages) || group.messages.length === 0) return;

        const fragment = document.createDocumentFragment();

        // 그룹 내부 메시지: 오래된 → 최신
        const messages = group.messages.slice().reverse().map(msg => createMessageElement(msg));

        // 그룹 날짜
        const groupDate = new Date(group.dateTime);

        // 구분선 삽입 (항상 그룹별 첫 메시지 기준)
        fragment.appendChild(createDateSeparator(groupDate));

        messages.forEach(m => fragment.appendChild(m));
        chatMessages.prepend(fragment);
      };

      // =======================
      // 새 메시지 추가
      // =======================
      const addMessage = (msg) => {
        const msgDate = new Date(msg.timestamp);

        // 마지막 구분선 확인
        const separators = chatMessages.querySelectorAll('.date-separator');
        const lastSeparator = separators[separators.length - 1];
        let shouldAddDateSeparator = true;
        if (lastSeparator?.dataset?.date) {
          const [y,m,d] = lastSeparator.dataset.date.split('-').map(Number);
          const lastDate = new Date(y, m-1, d);
          shouldAddDateSeparator = isDifferentDate(lastDate, msgDate);
        }

        if (shouldAddDateSeparator) chatMessages.appendChild(createDateSeparator(msgDate));
        chatMessages.appendChild(createMessageElement(msg));

        if (isAtBottom) chatMessages.scrollTop = chatMessages.scrollHeight;
        else newMessageNotice.style.display = 'block';
      };

      // =======================
      // 이전 메시지 불러오기
      // =======================
      const loadOlderMessages = async () => {
        if (loadingOlder || !hasNext) return;
        loadingOlder = true;

        const firstWrapper = chatMessages.querySelector('.message-wrapper');
        const before = firstWrapper?.dataset.beforeCreatedAt;
        if (!before) { loadingOlder = false; return; }

        try {
          const res = await fetch(`/chat/room/${ROOM_ID}/chat?before=${before}`);
          if (!res.ok) throw new Error(`HTTP error! status: ${res.status}`);
          const data = await res.json();
          hasNext = data.hasNext;

          if (Array.isArray(data.messages) && data.messages.length > 0) {
            const oldScrollHeight = chatMessages.scrollHeight;

            // 새로 불러온 그룹 중 가장 최신 그룹
            const newestGroup = data.messages[0];
            const newestGroupDate = new Date(newestGroup.dateTime);


            // 이전 로드된 가장 오래된 그룹 날짜와 비교
            if (tempOldestGroupDate && !isDifferentDate(tempOldestGroupDate, newestGroupDate)) {
              // 구분선 제거
              const firstSeparator = chatMessages.querySelector('.date-separator');
              if (firstSeparator) {
                firstSeparator.remove();
              }
            }

            // 그룹별 prepend
            data.messages.forEach(group => {
              prependGroup(group);
            });

            // 가장 오래된 그룹 날짜 갱신
            const oldestGroup = data.messages[data.messages.length - 1];
            tempOldestGroupDate = new Date(oldestGroup.dateTime);

            // 스크롤 위치 보존
            chatMessages.scrollTop = chatMessages.scrollHeight - oldScrollHeight;
          }

        } catch (err) {
          console.error(err);
        } finally { loadingOlder = false; }
      };

      // =======================
      // WebSocket 연결
      // =======================
      const connectWebSocket = () => {
        const socket = new SockJS('http://localhost:8070/ws-chat');
        stompClient = Stomp.over(socket);
        stompClient.debug = null;

        stompClient.connect({}, () => {
          stompClient.subscribe(`/sub/chat.room.${ROOM_ID}`, payload => {
            const msg = JSON.parse(payload.body);
            if (msg.senderId === MY_USER_ID) return;
            addMessage(msg);
          });
        });
      };

      // =======================
      // 메시지 전송
      // =======================
      const sendMessage = () => {
        const text = messageInput.value.trim();
        if (!text) return;

        addMessage({
          senderId: MY_USER_ID,
          senderNickname: null,
          content: text,
          createdAt: crypto.randomUUID(),
          timestamp: new Date().toISOString()
        });

        stompClient.send("/pub/chat.send", {}, JSON.stringify({
          roomId: ROOM_ID,
          senderId: MY_USER_ID,
          content: text,
          messageType: "TEXT"
        }));

        messageInput.value = '';
      };

      // =======================
      // 이벤트 바인딩
      // =======================
      sendBtn.onclick = sendMessage;
      messageInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
      });

      plusBtn.addEventListener('click', () => {
        attachments.classList.toggle('active');
        plusBtn.classList.toggle('toggled');
      });

      chatMessages.addEventListener('scroll', () => {
        if (chatMessages.scrollTop === 0) loadOlderMessages();
        isAtBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 20;
        if (isAtBottom) newMessageNotice.style.display = 'none';
      });

      newMessageNotice.addEventListener('click', () => {
        chatMessages.scrollTop = chatMessages.scrollHeight;
        newMessageNotice.style.display = 'none';
        isAtBottom = true;
      });

      // =======================
      // 초기 메시지 로딩
      // =======================
      fetch(`/chat/room/${ROOM_ID}/chat`)
              .then(res => res.json())
              .then(data => {
                if (Array.isArray(data.messages)) {
                  data.messages.reverse().forEach(group => {
                    group.messages.reverse();
                    prependGroup(group)
                  });

                  const oldestGroup = data.messages[data.messages.length - 1];
                  if (oldestGroup && Array.isArray(oldestGroup.messages) && oldestGroup.messages.length > 0) {
                    tempOldestGroupDate = new Date(oldestGroup.messages[0].timestamp);
                    console.log('tempOldestGroupDate set to:', tempOldestGroupDate.toDateString());
                    }
                }
                chatMessages.scrollTop = chatMessages.scrollHeight;
              });

      connectWebSocket();
    });
  </script>
  </body>
  </html>
