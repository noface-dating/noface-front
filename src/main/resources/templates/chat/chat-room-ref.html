<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat Room</title>

  <style>
    * { box-sizing:border-box; margin:0; padding:0; font-family:'Arial', sans-serif; }
    body { background:#fafafa; display:flex; justify-content:center; align-items:center; height:100vh; }

    .chat-container {
      position:relative;
      width:400px; height:600px;
      border:1px solid #ccc; border-radius:10px;
      display:flex; flex-direction:column;
      background:#fff; overflow:hidden;
      box-shadow:0 4px 10px rgba(0,0,0,0.1);
    }

    .chat-header {
      padding:10px 15px;
      border-bottom:1px solid #eee;
      font-weight:bold;
      display:flex;
      align-items:center;
      gap:10px;
    }

    .back-btn { cursor:pointer; font-size:20px; border:none; background:none; }

    .chat-messages {
      flex:1;
      padding:10px 15px;
      display:flex;
      flex-direction:column;
      gap:8px;
      overflow-y:auto;
      background:#7a7a7a;
      position:relative;
    }

    .message-wrapper {
      display:flex;
      align-items:flex-end;
      gap:6px;
    }

    .message-wrapper.sent { flex-direction:row-reverse; }
    .message-wrapper.received { flex-direction:row; }

    .profile {
      width:32px; height:32px;
      border-radius:50%;
      overflow:hidden;
      background:#ccc;
    }

    .profile img { width:100%; height:100%; object-fit:cover; }

    .message {
      max-width:70%;
      padding:8px 12px;
      border-radius:20px;
      font-size:14px;
      display:flex;
      flex-direction:column;
      gap:2px;
    }

    .message.sent {
      background:#fff;
      border-bottom-right-radius:4px;
    }

    .message.received {
      background:#b2b5b8;
      border-bottom-left-radius:4px;
    }

    .message-time {
      font-size:11px;
      color:#777;
      align-self:flex-end;
    }

    .chat-input {
      display:flex;
      padding:8px 10px;
      border-top:1px solid #eee;
      background:#fff;
      position:relative;
    }

    .chat-input input {
      flex:1;
      padding:8px 12px;
      border-radius:20px;
      border:1px solid #ccc;
    }

    .send-btn {
      margin-left:6px;
      border:none;
      background:none;
      font-size:20px;
      cursor:pointer;
      color:#007aff;
    }

    .plus-btn {
      font-size:24px;
      cursor:pointer;
      border:none;
      background:none;
      margin-right:6px;
      transition: transform 0.3s ease;
    }

    .plus-btn.toggled {
      transform: rotate(45deg);
    }

    .attachments {
      position:absolute;
      bottom: 95%;
      left:10px;
      margin-bottom:10px;
      display:flex;
      gap:6px;
      opacity:0;
      pointer-events:none;
      transition: all 0.3s ease;
    }

    .attachments.active {
      opacity:1;
      pointer-events:auto;
    }

    .attachments button {
      font-size:20px;
      border:none;
      border-radius:50%;
      width:40px;
      height:40px;
      cursor:pointer;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f0f0f0;
      color:#333;
      box-shadow:0 2px 5px rgba(0,0,0,0.1);
      transform: translateY(20px);
      opacity:0;
      transition: all 0.3s ease;
    }

    .attachments.active button {
      transform: translateY(0);
      opacity:1;
    }

    .attachments button:hover {
      transform: scale(1.1);
    }

    .new-message-notice {
      position:absolute;
      bottom:60px;
      left:50%;
      transform:translateX(-50%);
      background:#007aff;
      color:#fff;
      padding:5px 12px;
      border-radius:20px;
      font-size:13px;
      display:none;
      cursor:pointer;
    }

    .date-separator {
      text-align:center;
      margin:15px 0;
      font-size:12px;
      color:#eee;
    }
  </style>

  <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.6.1/dist/sockjs.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>

<body>
<div class="chat-container">
  <div class="chat-header">
    <button class="back-btn" onclick="history.back()">←</button>
    <span>채팅방</span>
  </div>

  <div class="chat-messages" id="chatMessages">
    <!-- 기존 메시지 로드 -->
    <th:block th:each="msg : ${messages}">
      <div class="message-wrapper"
           th:classappend="${msg.senderId == userId} ? ' sent' : ' received'"
           th:data-before-created-at="${msg.createdAt}"
           th:data-timestamp="${#temporals.format(msg.createdAt,'yyyy-MM-dd''T''HH:mm:ss')}">

        <div class="profile" th:if="${msg.senderId != userId}">
          <img src="https://via.placeholder.com/32">
        </div>

        <div class="message" th:classappend="${msg.senderId == userId} ? ' sent' : ' received'">
          <div th:if="${msg.senderId != userId}" style="font-size:11px;color:#555"
               th:text="${msg.senderNickname}"></div>
          <span th:text="${msg.content}"></span>
          <span class="message-time" th:text="${#temporals.format(msg.createdAt,'a hh:mm')}"></span>
        </div>
      </div>
    </th:block>
  </div>

  <div class="new-message-notice" id="newMessageNotice">새 메시지 도착</div>

  <div class="chat-input">
    <button class="plus-btn" id="plusBtn">+</button>
    <div class="attachments" id="attachments">
      <button class="photo" title="사진">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-image">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
          <circle cx="8.5" cy="8.5" r="1.5"></circle>
          <polyline points="21 15 16 10 5 21"></polyline>
        </svg>
      </button>
      <button class="video" title="영상">
        <svg xmlns="http://www.w3.org/2000/svg"
             width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-video">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
      </button>
    </div>
    <input type="text" id="messageInput" placeholder="메시지 입력...">
    <button class="send-btn" id="sendBtn">➤</button>
  </div>
</div>

<script th:inline="javascript">
  const ROOM_ID = /*[[${roomId}]]*/ null;
  const MY_USER_ID = /*[[${userId}]]*/ null;
</script>

<script>
  const chatMessages = document.getElementById('chatMessages');
  const messageInput = document.getElementById('messageInput');
  const sendBtn = document.getElementById('sendBtn');
  const plusBtn = document.getElementById('plusBtn');
  const attachments = document.getElementById('attachments');
  const newMessageNotice = document.getElementById('newMessageNotice');

  let stompClient = null;
  let isAtBottom = true;
  let loadingOlder = false;
  let hasNext = true;

  window.onload = () => { chatMessages.scrollTop = chatMessages.scrollHeight; };

  chatMessages.addEventListener('scroll', () => {
    if (chatMessages.scrollTop === 0) loadOlderMessages();
    isAtBottom = chatMessages.scrollHeight - chatMessages.scrollTop - chatMessages.clientHeight < 20;
    if (isAtBottom) newMessageNotice.style.display = 'none';
  });

  plusBtn.addEventListener('click', () => {
    attachments.classList.toggle('active');
    plusBtn.classList.toggle('toggled');
  });

  function isDifferentDate(d1,d2){return d1.getFullYear()!==d2.getFullYear()||d1.getMonth()!==d2.getMonth()||d1.getDate()!==d2.getDate();}
  function createDateSeparator(dateObj){const s=document.createElement('div');s.classList.add('date-separator');s.textContent=`${dateObj.getFullYear()}년 ${(dateObj.getMonth()+1).toString().padStart(2,'0')}월 ${dateObj.getDate().toString().padStart(2,'0')}일`;return s;}
  function toMillis(ts){if(!ts)return Date.now();if(typeof ts==='number')return ts;return new Date(ts).getTime();}
  function formatTime(ts){const d=new Date(ts);const h=d.getHours();const m=d.getMinutes().toString().padStart(2,'0');const p=h<12?'오전':'오후';const h12=h%12===0?12:h%12;return `${p} ${h12.toString().padStart(2,'0')}:${m}`;}

  async function loadOlderMessages(){
    if(loadingOlder||!hasNext)return;loadingOlder=true;
    const first=chatMessages.querySelector('.message-wrapper:first-child');const before=first?.dataset.beforeCreatedAt;
    if(!before){loadingOlder=false;return;}
    try{
      const oldHeight=chatMessages.scrollHeight;
      const res=await fetch(`/chat/room/${ROOM_ID}?before=${before}`);
      if(!res.ok)throw new Error(`HTTP error! status: ${res.status}`);
      const data=await res.json();
      hasNext=data.hasNext;
      if(data.messages?.length>0){
        data.messages.reverse().forEach(prependMessage);
        chatMessages.scrollTop=chatMessages.scrollHeight-oldHeight;
      }
    }catch(e){console.error('Error loading older messages:',e);}
    finally{loadingOlder=false;}
  }

  function prependMessage(msg){
    const ts=toMillis(msg.timestamp),d=new Date(ts);
    const first=chatMessages.querySelector('.message-wrapper:first-child');
    let addSep=!first||isDifferentDate(d,new Date(toMillis(first.dataset.timestamp)));
    const w=document.createElement('div');w.classList.add('message-wrapper',msg.senderId===MY_USER_ID?'sent':'received');w.dataset.timestamp=ts;w.dataset.beforeCreatedAt=msg.createdAt;
    const m=document.createElement('div');m.classList.add('message',msg.senderId===MY_USER_ID?'sent':'received');
    if(msg.senderId!==MY_USER_ID){const n=document.createElement('div');n.style.fontSize='11px';n.style.color='#555';n.textContent=msg.senderNickname;m.appendChild(n);}
    const c=document.createElement('span');c.textContent=msg.content;
    const t=document.createElement('span');t.classList.add('message-time');t.textContent=formatTime(ts);
    m.append(c,t);w.appendChild(m);
    if(addSep) chatMessages.prepend(createDateSeparator(d));
    chatMessages.prepend(w);
  }

  function addMessage(text,type,timestamp=Date.now()){
    const ts=toMillis(timestamp),d=new Date(ts);
    const last=[...chatMessages.children].reverse().find(el=>el.classList.contains('message-wrapper'));
    let addSep=!last||isDifferentDate(d,new Date(Number(last.dataset.timestamp)));
    if(addSep) chatMessages.appendChild(createDateSeparator(d));
    const w=document.createElement('div');w.classList.add('message-wrapper',type);w.dataset.timestamp=ts;
    const m=document.createElement('div');m.classList.add('message',type);
    const c=document.createElement('span');c.textContent=text;
    const t=document.createElement('span');t.classList.add('message-time');t.textContent=formatTime(ts);
    m.append(c,t);w.appendChild(m);chatMessages.appendChild(w);
    if(isAtBottom) chatMessages.scrollTop=chatMessages.scrollHeight;
    else newMessageNotice.style.display='block';
  }

  function connectWebSocket(){
    const s=new SockJS('http://localhost:8070/ws-chat');stompClient=Stomp.over(s);stompClient.debug=null;
    stompClient.connect({},()=>{stompClient.subscribe(`/sub/chat.room.${ROOM_ID}`,p=>{const msg=JSON.parse(p.body);if(msg.senderId===MY_USER_ID)return;addMessage(msg.content,'received',msg.timestamp);});});
  }

  function sendMessage(){
    const t=messageInput.value.trim();if(!t)return;
    stompClient.send("/pub/chat.send",{},JSON.stringify({roomId:ROOM_ID,senderId:MY_USER_ID,content:t,messageType:"TEXT"}));
    messageInput.value='';
  }

  sendBtn.onclick=sendMessage;
  messageInput.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}});
  connectWebSocket();
  newMessageNotice.addEventListener('click',()=>{chatMessages.scrollTop=chatMessages.scrollHeight;newMessageNotice.style.display='none';isAtBottom=true;});
</script>

</body>
</html>
