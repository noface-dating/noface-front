<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 채팅')}"></head>
<body>
<div class="app-root">
  <div class="min-h-screen bg-white flex flex-col" style="display:flex;flex-direction:column">
    <header class="page-header" style="z-index:20">
      <button type="button" onclick="HideApp.goBack()" class="back-btn" aria-label="뒤로">←</button>
      <button type="button" id="partnerAvatar" class="avatar-placeholder avatar-md" style="cursor:pointer" aria-label="상대방 프로필 보기">👤</button>
      <div style="flex:1;min-width:0"><p id="partnerName" class="font-semibold text-primary"></p></div>
      <div style="position:relative">
        <button type="button" id="menuBtn" style="padding:0.5rem;color:var(--color-primary);border-radius:0.5rem;background:none;border:none;cursor:pointer" aria-label="더보기">⋮</button>
        <ul id="menuDropdown" style="display:none;position:absolute;right:0;top:100%;margin-top:0.25rem;padding:0.25rem 0;min-width:120px;background:#fff;border:2px solid rgba(17,17,17,0.1);border-radius:var(--radius-button);box-shadow:var(--shadow-card);z-index:20;list-style:none">
          <li><button type="button" style="width:100%;padding:0.5rem 1rem;text-align:left;font-size:0.875rem;color:var(--color-primary);background:none;border:none;cursor:pointer">차단</button></li>
          <li><button type="button" style="width:100%;padding:0.5rem 1rem;text-align:left;font-size:0.875rem;color:var(--color-primary);background:none;border:none;cursor:pointer">신고하기</button></li>
        </ul>
      </div>
    </header>
    <div id="messagesArea" style="flex:1;overflow-y:auto;padding:1rem" class="space-y-4">
      <p class="text-center text-xs text-gray-400" style="padding:0.5rem 0">오늘</p>
    </div>
    <div id="imagePreviewArea" style="display:none;padding:0.75rem 0.75rem 0;display:flex;align-items:center;gap:0.5rem"></div>
    <form id="chatForm" style="padding:0.75rem;border-top:2px solid rgba(17,17,17,0.2);display:flex;align-items:center;gap:0.5rem;background:#fff">
      <input type="file" accept="image/*" id="fileInput" style="display:none">
      <button type="button" id="attachBtn" style="padding:0.5rem;color:var(--color-primary);border-radius:0.5rem;background:none;border:none;cursor:pointer" aria-label="이미지 첨부">+</button>
      <input type="text" id="msgInput" placeholder="메시지를 입력하세요..." style="flex:1;padding:0.625rem 1rem;background:var(--color-surface);border-radius:9999px;border:none;outline:none;font-size:0.875rem;color:var(--color-primary);font-family:inherit">
      <button type="submit" class="btn btn-primary" style="width:auto;padding:0.625rem 1rem">전송</button>
    </form>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
(function(){
  var chatId = location.pathname.split('/').pop();
  var area = document.getElementById('messagesArea');
  
  // 더미 데이터 삭제됨. 실제 채팅 메시지는 API 연동 필요.
  area.innerHTML = '<p class="text-center text-xs text-gray-400" style="padding:0.5rem 0">채팅 서버와 연결이 필요합니다.</p>';

  var menuOpen = false;
  document.getElementById('menuBtn').addEventListener('click', function(){ menuOpen=!menuOpen; document.getElementById('menuDropdown').style.display=menuOpen?'block':'none'; });
  document.addEventListener('click', function(e){ if(!e.target.closest('#menuBtn')&&!e.target.closest('#menuDropdown')){ menuOpen=false; document.getElementById('menuDropdown').style.display='none'; }});

  var imagePreview = null;
  document.getElementById('attachBtn').addEventListener('click', function(){ document.getElementById('fileInput').click(); });
  document.getElementById('fileInput').addEventListener('change', function(e){
    var file = e.target.files && e.target.files[0];
    if(file && file.type.startsWith('image/')){ imagePreview = URL.createObjectURL(file); }
    e.target.value = '';
  });

  document.getElementById('chatForm').addEventListener('submit', function(e){
    e.preventDefault();
    // API 전송 로직 구현 필요
    document.getElementById('msgInput').value='';
    imagePreview=null;
  });
})();
</script>
</body>
</html>
