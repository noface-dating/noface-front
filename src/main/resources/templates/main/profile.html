<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 프로필')}"></head>
<body>
<div class="app-root with-bottom-nav">
  <header class="page-header"><h1>HIDE</h1></header>
  <div class="p-4 max-w-md mx-auto">
    <div class="card">
      <div class="card-photo" style="aspect-ratio:3/4"><span class="text-8xl">👤</span></div>
      <div class="p-4">
        <h2 id="userName" class="text-xl font-semibold text-primary"></h2>
        <p id="userIntro" class="text-sm text-gray-600 mt-1" style="display:flex;align-items:center;gap:0.25rem"></p>
        <p id="userRegion" class="text-sm text-gray-500 mt-1" style="display:flex;align-items:center;gap:0.25rem"></p>
        <div id="userTags" style="display:flex;flex-wrap:wrap;gap:0.375rem;margin-top:0.75rem"></div>
      </div>
    </div>
    <nav style="margin-top:1.5rem;border-radius:var(--radius-card);background:#fff;box-shadow:var(--shadow-card);overflow:hidden">
      <button type="button" onclick="location.href='/profile/edit'" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;text-align:left;background:none;border:none;border-bottom:1px solid rgba(17,17,17,0.1);cursor:pointer;color:var(--color-primary)">
        <span>프로필 수정</span><span class="text-gray-400">›</span>
      </button>
      <button type="button" onclick="location.href='/support'" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;text-align:left;background:none;border:none;cursor:pointer;color:var(--color-primary)">
        <span>고객지원</span><span class="text-gray-400">›</span>
      </button>
    </nav>
  </div>
  <div th:replace="~{fragments/layout :: bottomNav}"></div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
(function(){
  var u = HideMock.mockUser;
  document.getElementById('userName').textContent = u.nickname+', '+u.age;
  document.getElementById('userIntro').textContent = '💬 '+u.intro;
  document.getElementById('userRegion').textContent = '📍 '+u.region;
  var tags = document.getElementById('userTags');
  u.interests.forEach(function(t){ var s=document.createElement('span'); s.className='tag'; s.style.padding='0.25rem 0.625rem'; s.textContent=t; tags.appendChild(s); });
})();
</script>
</body>
</html>
