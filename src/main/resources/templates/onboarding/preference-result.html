<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 이상형 결과')}"></head>
<body>
<div class="app-root">
  <div class="min-h-screen bg-white flex flex-col p-6" style="display:flex;flex-direction:column">
    <button type="button" onclick="HideApp.goBack()" class="back-btn self-start" aria-label="뒤로">←</button>
    <div class="flex-1 flex flex-col justify-center max-w-sm mx-auto w-full text-center">
      <div style="border-radius:var(--radius-card);background:var(--color-surface);border:2px solid rgba(17,17,17,0.1);padding:1.5rem">
        <p class="text-xl font-semibold text-primary leading-snug">당신의 이상형은<br>&quot;무표정 반전 큐티상&quot;입니다</p>
        <ul class="mt-6 text-left space-y-2 text-sm text-primary" style="list-style:none">
          <li>· 부드러운 눈매와 자연스러운 스타일을 선호하는 편이에요.</li>
          <li>· 무표정해 보여도 웃을 때 매력이 돋보이는 타입을 좋아해요.</li>
          <li>· 비슷한 취향을 가진 사람과 매칭될 확률이 높아요.</li>
        </ul>
      </div>
      <p class="text-primary text-sm mt-6">친구의 이상형이 알고 싶다면 친구를 초대하세요</p>
      <button type="button" id="shareBtn" class="btn btn-outline mt-2 w-full" style="padding:0.625rem;font-size:0.875rem">공유하기</button>
      <p id="copyMsg" class="text-primary text-xs mt-1" style="display:none"></p>
      <p class="text-primary font-medium text-sm mt-6">당신의 이상형이<br>하이드를 사용하고 있습니다</p>
      <p class="text-gray-600 text-sm mt-2">가입을 원하시면 아래 시작하기 버튼을 눌러주세요.</p>
      <button type="button" onclick="location.href='/signup'" class="btn btn-primary mt-8">시작하기</button>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
document.getElementById('shareBtn').addEventListener('click', function() {
  var url = location.origin + '/onboarding';
  var text = '나의 이상형은 "무표정 반전 큐티상"이에요. 당신의 이상형도 찾아보세요!';
  if (navigator.share) {
    navigator.share({ title: 'HIDE - 당신의 이상형을 찾아드립니다', text: text, url: url }).catch(function(){});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text + '\n' + url).then(function() {
      var msg = document.getElementById('copyMsg');
      msg.textContent = '링크가 복사되었습니다';
      msg.style.display = 'block';
      setTimeout(function() { msg.style.display = 'none'; }, 2000);
    });
  }
});
</script>
</body>
</html>
