<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('취향 테스트')}"></head>
<body class="min-h-screen min-h-[100dvh] bg-white flex flex-col p-4">
<div class="app-shell w-full mx-auto flex flex-col flex-1 max-w-md">
  <div class="flex items-center justify-between py-4">
    <a href="javascript:history.back()" class="p-2 text-primary inline-tap" aria-label="뒤로">←</a>
    <span class="text-sm font-medium text-primary" th:text="${roundDisplay} + ' / ' + ${totalRounds}">1 / 10</span>
  </div>
  <div class="h-1.5 bg-surface rounded-full overflow-hidden mb-6">
    <div class="h-full bg-primary rounded-full transition-all" th:style="|width: ${progressPct}%|"></div>
  </div>
  <h1 class="text-xl font-semibold text-primary text-center mb-1">당신의 선택은?</h1>
  <p class="text-gray-500 text-sm text-center mb-6">더 마음에 드는 쪽을 선택해 주세요</p>
  <form th:action="@{/onboarding/face-preference}" method="post" class="flex-1 grid grid-cols-2 gap-4">
    <button type="submit" name="choice" value="A"
            class="aspect-[3/4] rounded-card bg-surface border-2 border-primary/20 hover:border-primary flex flex-col items-center justify-center transition-colors">
      <span class="text-6xl mb-2">👤</span>
      <span class="text-sm text-primary font-medium">A</span>
    </button>
    <button type="submit" name="choice" value="B"
            class="aspect-[3/4] rounded-card bg-surface border-2 border-primary/20 hover:border-primary flex flex-col items-center justify-center transition-colors">
      <span class="text-6xl mb-2">👤</span>
      <span class="text-sm text-primary font-medium">B</span>
    </button>
  </form>
</div>
</body>
</html>
