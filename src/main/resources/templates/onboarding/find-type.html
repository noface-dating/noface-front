<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 이상형 찾기')}"></head>
<body>
<div class="app-root">
  <div class="min-h-screen bg-white flex flex-col p-6" style="display:flex;flex-direction:column">
    <button type="button" onclick="HideApp.goBack()" class="back-btn self-start" aria-label="뒤로">←</button>
    <div class="flex-1 flex flex-col justify-center items-center text-center max-w-sm mx-auto w-full">
      <h1 class="text-xl font-semibold text-primary leading-snug">당신의 이상형을 찾아드립니다</h1>
      <p class="text-sm text-gray-500 mt-2">성별을 선택해 주세요</p>
      <div class="mt-10 w-full" style="display:flex;flex-direction:column;gap:0.75rem">
        <button type="button" onclick="location.href='/onboarding/face-preference?gender=male'" class="btn btn-outline" style="padding:0.875rem;font-size:1rem">남성</button>
        <button type="button" onclick="location.href='/onboarding/face-preference?gender=female'" class="btn btn-outline" style="padding:0.875rem;font-size:1rem">여성</button>
      </div>
    </div>
  </div>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
</body>
</html>
