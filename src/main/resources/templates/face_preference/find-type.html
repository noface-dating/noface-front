<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>이상형 찾기 - Hide</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: {
        colors: { primary: '#111111', surface: '#F5F5F0' },
        borderRadius: { card: '1.25rem', button: '0.75rem' }
      }}
    }
  </script>
</head>
<body class="min-h-screen bg-white flex flex-col"
      style="font-family: system-ui, sans-serif; max-width: 430px; margin: 0 auto;">
  <div class="p-4 pt-3">
    <a href="javascript:history.back()" class="inline-block p-2 -ml-2 text-[#111] text-xl">←</a>
  </div>
  <div class="flex-1 flex flex-col justify-center items-center text-center px-6">
    <h1 class="text-xl font-semibold text-[#111] mb-2">당신의 이상형을 찾아드립니다</h1>
    <p class="text-sm text-gray-500 mb-10">당신의 성별을 선택해 주세요</p>
    <div class="w-full flex flex-col gap-3">
      <a href="/face-preference/quiz?gender=MALE"
         class="w-full py-5 border-2 border-[#111] text-[#111] rounded-[0.75rem] font-medium text-base text-center block">
        <span class="block font-semibold">여자</span>
        <span class="block text-xs text-gray-400 mt-1 font-normal">남자 사진으로 취향을 골라요</span>
      </a>
      <a href="/face-preference/quiz?gender=FEMALE"
         class="w-full py-5 border-2 border-[#111] text-[#111] rounded-[0.75rem] font-medium text-base text-center block">
        <span class="block font-semibold">남자</span>
        <span class="block text-xs text-gray-400 mt-1 font-normal">여자 사진으로 취향을 골라요</span>
      </a>
    </div>
  </div>
</body>
</html>
