<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FFFFFF;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .back-button {
            align-self: flex-start;
            padding: 0.5rem;
            margin-left: -0.5rem;
            margin-bottom: 2rem;
            background: none;
            border: none;
            color: #111111;
            font-size: 18px;
            cursor: pointer;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 24rem;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-size: 1.5rem;
            line-height: 2rem;
            font-weight: 600;
            color: #111111;
            margin: 0;
        }

        .subtitle {
            color: #6B7280;
            margin-top: 0.25rem;
            font-size: 14px;
        }

        .form {
            margin-top: 2rem;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #111111;
            margin-bottom: 0.25rem;
        }

        input {
            width: 100%;
            padding: 1rem 1rem;
            border: 2px solid rgba(17, 17, 17, 0.3);
            border-radius: 12px;
            font-size: 14px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus {
            border-color: #111111;
        }

        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            background-color: #111111;
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 500;
            margin-top: 0.5rem;
            cursor: pointer;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }

        .footer {
            text-align: center;
            font-size: 14px;
            color: #6B7280;
            margin-top: 1.5rem;
        }

        .footer a {
            color: #111111;
            font-weight: 500;
            text-decoration: none;
        }

        .error {
            color: #EF4444;
            font-size: 14px;
            margin-top: 1rem;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="content">
        <!-- 뒤로가기 -->
        <button type="button" onclick="history.back()" class="back-button">
            ←
        </button>

        <h1>로그인</h1>
        <p class="subtitle">HIDE에 오신 것을 환영해요</p>

        <!-- 로그인 폼 -->
        <!-- TODO: Auth 서버에서 지정한 운영환경 도메인 경로로 수정 필요 -->
        <div class="form">
            <div class="form-group">
                <label>아이디</label>
                <input type="text" id="username" placeholder="아이디" autocomplete="username"/>
            </div>

            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호" autocomplete="current-password"/>
            </div>

            <!-- 에러 메시지 -->
            <p id="error-msg" class="error" style="display:none;">
                아이디 또는 비밀번호가 올바르지 않습니다.
            </p>

            <button type="button" class="submit-btn" onclick="doLogin()">로그인</button>
        </div>

        <script>
            async function doLogin() {
                const username = document.getElementById('username').value;
                const password = document.getElementById('password').value;

                try {
                    // TODO: 인증 서버 URL 하드코딩 제거 - Thymeleaf 서버사이드 변수 또는 meta 태그로 주입하여 운영 환경에서도 동작하도록 변경 필요
                    const response = await fetch('http://localhost:8060/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ username, password })
                    });

                    if (response.ok) {
                        window.location.href = '/main';
                    } else {
                        document.getElementById('error-msg').style.display = 'block';
                    }
                } catch (e) {
                    document.getElementById('error-msg').style.display = 'block';
                }
            }
        </script>

        <p class="footer">
            계정이 없으신가요?
            <a th:href="@{/signup}">회원가입</a>
        </p>
    </div>

</div>
</body>
</html>
