<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('로그인')}"></head>
<body class="min-h-screen min-h-[100dvh] bg-white flex flex-col p-6">
<div class="app-shell w-full max-w-sm mx-auto flex flex-col flex-1">
  <a href="javascript:history.back()" class="self-start p-2 -ml-2 text-primary inline-tap" aria-label="뒤로">←</a>
  <div class="flex-1 flex flex-col justify-center w-full">
    <h1 class="text-2xl font-semibold text-primary">로그인</h1>
    <p class="text-gray-500 mt-1 text-sm">HIDE에 오신 것을 환영해요</p>
    <form th:action="@{/login}" method="post" class="mt-8 space-y-4">
      <div>
        <label class="block text-sm font-medium text-primary mb-1">아이디</label>
        <input type="text" name="userId" class="w-full px-4 py-3 border-2 border-primary/30 rounded-button focus:border-primary" placeholder="아이디" autocomplete="username"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-primary mb-1">비밀번호</label>
        <input type="password" name="password" class="w-full px-4 py-3 border-2 border-primary/30 rounded-button focus:border-primary" placeholder="비밀번호" autocomplete="current-password"/>
      </div>
      <button type="submit" class="w-full py-3.5 bg-primary text-white rounded-button font-medium mt-2">로그인</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-6">
      계정이 없으신가요? <a href="/signup" class="text-primary font-medium">회원가입</a>
    </p>
  </div>
</div>
</body>
</html>
