<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head th:replace="~{fragments/head :: head('회원가입')}"></head>
<body class="min-h-screen min-h-[100dvh] bg-white flex flex-col p-6">
<div class="app-shell w-full max-w-sm mx-auto flex flex-col flex-1">
  <a href="javascript:history.back()" class="self-start p-2 -ml-2 text-primary inline-tap" aria-label="뒤로">←</a>
  <div class="flex-1 flex flex-col justify-center w-full">
    <h1 class="text-2xl font-semibold text-primary">회원가입</h1>
    <p class="text-gray-500 mt-1 text-sm">아이디와 비밀번호를 입력하고 약관에 동의해 주세요</p>
    <p class="text-gray-400 text-xs mt-1">데모: 입력 없이「가입하기」만 눌러도 진행돼요</p>
    <p th:if="${error}" class="text-red-500 text-sm mt-4" th:text="${error}"></p>
    <form th:action="@{/signup}" method="post" id="signupForm" class="mt-8 space-y-4">
      <div>
        <label class="block text-sm font-medium text-primary mb-1">아이디</label>
        <div class="flex gap-2">
          <input type="text" name="userId" id="userId"
                 class="flex-1 px-4 py-3 border-2 border-primary/30 rounded-button focus:border-primary" placeholder="아이디"/>
          <button type="button" id="idCheckBtn"
                  class="px-4 py-3 border-2 border-primary text-primary rounded-button font-medium text-sm whitespace-nowrap">
            중복 확인
          </button>
        </div>
        <p id="idCheckMsg" class="text-xs mt-1 hidden"></p>
      </div>
      <div>
        <label class="block text-sm font-medium text-primary mb-1">비밀번호</label>
        <input type="password" name="password" id="password"
               class="w-full px-4 py-3 border-2 border-primary/30 rounded-button focus:border-primary" placeholder="비밀번호"/>
      </div>
      <div>
        <label class="block text-sm font-medium text-primary mb-1">비밀번호 확인</label>
        <input type="password" name="passwordConfirm" id="passwordConfirm"
               class="w-full px-4 py-3 border-2 border-primary/30 rounded-button focus:border-primary" placeholder="비밀번호 확인"/>
        <p id="pwMismatch" class="text-red-500 text-xs mt-1 hidden">비밀번호가 일치하지 않습니다</p>
      </div>
      <div class="space-y-3 pt-2">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="agree1" value="true" class="rounded border-2 border-primary/40 accent-primary"/>
          <span class="text-sm text-primary">이용약관 동의 (필수)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="agree2" value="true" class="rounded border-2 border-primary/40 accent-primary"/>
          <span class="text-sm text-primary">개인정보 처리방침 동의 (필수)</span>
        </label>
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" name="agree3" value="true" class="rounded border-2 border-primary/40 accent-primary"/>
          <span class="text-sm text-primary">위치 정보 수집 및 이용 동의 (선택)</span>
        </label>
      </div>
      <button type="submit" class="w-full py-3.5 bg-primary text-white rounded-button font-medium mt-6">가입하기</button>
    </form>
    <p class="text-center text-sm text-gray-500 mt-6">
      이미 계정이 있으신가요? <a href="/login" class="text-primary font-medium">로그인</a>
    </p>
  </div>
</div>
<script>
  (function () {
    var taken = ['admin', 'test', 'hide'];
    var userId = document.getElementById('userId');
    var msg = document.getElementById('idCheckMsg');
    var btn = document.getElementById('idCheckBtn');
    userId.addEventListener('input', function () { msg.classList.add('hidden'); });
    btn.addEventListener('click', function () {
      var id = (userId.value || '').trim();
      if (!id) { msg.textContent = '아이디를 입력해 주세요'; msg.className = 'text-xs mt-1 text-red-500'; msg.classList.remove('hidden'); return; }
      if (id.length < 2) { msg.textContent = '2자 이상 입력해 주세요'; msg.className = 'text-xs mt-1 text-red-500'; msg.classList.remove('hidden'); return; }
      if (taken.indexOf(id.toLowerCase()) >= 0) { msg.textContent = '이미 사용 중인 아이디예요'; msg.className = 'text-xs mt-1 text-red-500'; msg.classList.remove('hidden'); return; }
      msg.textContent = '사용 가능해요'; msg.className = 'text-xs mt-1 text-primary'; msg.classList.remove('hidden');
    });
  })();
</script>
</body>
</html>
