<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FFFFFF;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .back-btn {
            align-self: flex-start;
            padding: 0.5rem;
            margin-left: -0.5rem;
            margin-bottom: 2rem;
            background: none;
            border: none;
            color: #111111;
            font-size: 18px;
            cursor: pointer;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 24rem;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 0.1rem;
            color: #111111;
        }

        .subtitle {
            color: #6B7280;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: #111111;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgb(17, 17, 17, 0.3);
            border-radius: 8px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #111111;
        }

        .row {
            display: flex;
            gap: 0.5rem;
        }

        .check-btn {
            padding: 1rem;
            border: 2px solid #111111;
            background: white;
            color: #111111;
            font-weight: 500;
            border-radius: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .message {
            font-size: 12px;
            margin-top: 0.25rem;
        }

        .error {
            color: #EF4444;
            font-size: 14px;
        }

        .success {
            color: #16A34A;
            font-size: 14px;
        }

        .checkbox-group {
            margin-top: 0.5rem;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0.5rem;
            font-size: 14px;
        }

        input[type="checkbox"] {
            accent-color: #111111;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            margin-top: 1.5rem;
            background-color: #111111;
            color: white;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 14px;
            color: #6B7280;
        }

        .footer a {
            color: #111111;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="content">

        <button class="back-btn" onclick="history.back()">←</button>

        <h1>회원가입</h1>
        <p class="subtitle">아이디와 비밀번호를 입력하고 약관에 동의해 주세요</p>

        <form th:action="@{/signup}" method="post">

            <!-- 아이디 -->
            <div class="form-group">
                <label>아이디</label>
                <div class="row">
                    <input type="text" name="username" placeholder="아이디"/>
                    <button type="button" class="check-btn" onclick="checkId()">중복 확인</button>
                </div>
                <p id="idCheckMessage" class="message"></p>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" name="password" placeholder="비밀번호"/>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label>비밀번호 확인</label>
                <input type="password" id="passwordConfirm" placeholder="비밀번호 확인"/>
                <p id="passwordMessage" class="message error"></p>
            </div>

            <!-- tempKey -->
            <input type="hidden" name="tempKey" th:value="${tempKey}"/>

            <!-- 약관 -->
            <div class="checkbox-group">
                <label><input type="checkbox" name="agree1"/> 이용약관 동의 (필수)</label>
                <label><input type="checkbox" name="agree2"/> 개인정보 처리방침 동의 (필수)</label>
                <label><input type="checkbox" name="agree3"/> 위치 정보 동의 (선택)</label>
            </div>

            <button type="submit" class="submit-btn">가입하기</button>

        </form>

        <p class="footer">
            이미 계정이 있으신가요?
            <a th:href="@{/login}">로그인</a>
        </p>
    </div>
</div>

<script>
    function checkId() {
        const input = document.querySelector('input[name="username"]')
        const message = document.getElementById('idCheckMessage')
        const id = input.value.trim()

        if (!id) {
            message.innerText = '아이디를 입력해 주세요'
            message.className = 'message error'
            return
        }

        if (id.length < 2) {
            message.innerText = '2자 이상 입력해 주세요'
            message.className = 'message error'
            return
        }

        const takenIds = ['admin', 'test', 'hide']

        if (takenIds.includes(id.toLowerCase())) {
            message.innerText = '이미 사용 중인 아이디예요'
            message.className = 'message error'
        } else {
            message.innerText = '사용 가능해요'
            message.className = 'message success'
        }
    }

    const passwordInput = document.querySelector('input[name="password"]')
    const confirmInput = document.getElementById('passwordConfirm')
    const message = document.getElementById('passwordMessage')

    confirmInput.addEventListener('input', () => {
        if (confirmInput.value !== passwordInput.value) {
            message.innerText = '비밀번호가 일치하지 않습니다'
        } else {
            message.innerText = ''
        }
    })
</script>

</body>
</html>
