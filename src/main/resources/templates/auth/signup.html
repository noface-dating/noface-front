<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #FFFFFF;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
        }

        .back-btn {
            align-self: flex-start;
            padding: 0.5rem;
            margin-left: -0.5rem;
            margin-bottom: 2rem;
            background: none;
            border: none;
            color: #111111;
            font-size: 18px;
            cursor: pointer;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 24rem;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 0.1rem;
            color: #111111;
        }

        .subtitle {
            color: #6B7280;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 0.25rem;
            color: #111111;
        }

        input[type="text"],
        input[type="password"],
        input[type="email"] {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgb(17, 17, 17, 0.3);
            border-radius: 8px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #111111;
        }

        .row {
            display: flex;
            gap: 0.5rem;
        }

        .check-btn {
            padding: 1rem;
            border: 2px solid #111111;
            background: white;
            color: #111111;
            font-weight: 500;
            border-radius: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .message {
            font-size: 12px;
            margin-top: 0.25rem;
        }

        .error {
            color: #EF4444;
            font-size: 14px;
        }

        .success {
            color: #16A34A;
            font-size: 14px;
        }

        .checkbox-group {
            margin-top: 0.5rem;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 0.5rem;
            font-size: 14px;
        }

        input[type="checkbox"] {
            accent-color: #111111;
            cursor: pointer;
        }

        .submit-btn {
            width: 100%;
            padding: 0.875rem;
            margin-top: 1.5rem;
            background-color: #111111;
            color: white;
            border: none;
            border-radius: 0.75rem;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 14px;
            color: #6B7280;
        }

        .footer a {
            color: #111111;
            text-decoration: underline;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="content">

        <button class="back-btn" onclick="history.back()">←</button>

        <h1>회원가입</h1>
        <p class="subtitle">아이디와 비밀번호를 입력하고 약관에 동의해 주세요</p>

        <form th:action="@{/signup}"
              th:object="${signupUserRequest}"
              method="post">

            <!-- 아이디 -->
            <div class="form-group">
                <label>아이디</label>
                <div class="row">
                    <input type="text" th:field="*{username}" placeholder="아이디"/>
                    <button type="button" class="check-btn" onclick="checkId()">중복 확인</button>
                </div>

                <p id="idCheckMessage" class="message"></p>

                <p class="message error"
                   th:if="${#fields.hasErrors('username')}"
                   th:errors="*{username}">
                </p>
            </div>

            <!-- 비밀번호 -->
            <div class="form-group">
                <label>비밀번호</label>
                <input type="password" th:field="*{password}" placeholder="비밀번호 (최소 8자 이상)"/>

                <p class="message error"
                   th:if="${#fields.hasErrors('password')}"
                   th:errors="*{password}">
                </p>
            </div>

            <!-- 비밀번호 확인 -->
            <div class="form-group">
                <label>비밀번호 확인</label>
                <input type="password" id="passwordConfirm" placeholder="비밀번호 확인"/>
                <p id="passwordMessage" class="message error"></p>
            </div>

            <!-- 이메일 확인 -->
            <div class="form-group">
                <label>이메일</label>
                <input type="email" th:field="*{email}" placeholder="이메일"/>

                <p id="emailMessage" class="message"></p>

                <p class="message error"
                   th:if="${#fields.hasErrors('email')}"
                   th:errors="*{email}">
                </p>
            </div>

            <!-- tempKey -->
            <input type="hidden" name="tempKey" th:value="${tempKey}"/>

            <!-- 약관 -->
            <div class="checkbox-group">
                <label><input type="checkbox" name="agree1"/> 이용약관 동의 (필수)</label>
                <p id="agreeMessage1" class="message error"></p>

                <label><input type="checkbox" name="agree2"/> 개인정보 처리방침 동의 (필수)</label>
                <p id="agreeMessage2" class="message error"></p>

                <label><input type="checkbox" name="agree3"/> 위치 정보 동의 (선택)</label>
            </div>

            <button type="submit" class="submit-btn">가입하기</button>

        </form>

        <p class="footer">
            이미 계정이 있으신가요?
            <a th:href="@{/login}">로그인</a>
        </p>
    </div>
</div>

<script>
    // 아이디 중복 체크 (서버 연동)
    let isUsernameChecked = false

    document.querySelector('input[name="username"]').addEventListener('input', () => {
        isUsernameChecked = false
        idMessage.innerText = ''
    })

    const idMessage = document.getElementById('idCheckMessage')

    async function checkId() {
        const input = document.querySelector('input[name="username"]')
        const id = input.value.trim()

        if (!id) {
            idMessage.innerText = '아이디를 입력해 주세요'
            idMessage.className = 'message error'
            return
        }

        const res = await fetch(`/signup/check-username?username=${id}`)
        const isDuplicate = await res.json()

        if (isDuplicate) {
            idMessage.innerText = '이미 사용 중인 아이디예요'
            idMessage.className = 'message error'
            isUsernameChecked = false
        } else {
            idMessage.innerText = '사용 가능해요'
            idMessage.className = 'message success'
            isUsernameChecked = true
        }
    }

    // 비밀번호 확인
    const passwordInput = document.querySelector('input[name="password"]')
    const confirmInput = document.getElementById('passwordConfirm')
    const passwordMessage = document.getElementById('passwordMessage')

    confirmInput.addEventListener('input', () => {
        if (passwordInput.value.length < 8) {
            passwordMessage.innerText = '8자 이상 입력해 주세요'
        } else if (confirmInput.value !== passwordInput.value) {
            passwordMessage.innerText = '비밀번호가 일치하지 않습니다'
            passwordMessage.className = 'message error'
        } else {
            passwordMessage.innerText = '비밀번호가 일치합니다'
            passwordMessage.className = 'message success'
        }
    })

    // 이메일 실시간 검증
    const emailInput = document.querySelector('input[name="email"]')
    const emailMessage = document.getElementById('emailMessage')

    emailInput.addEventListener('input', () => {
        const value = emailInput.value.trim()
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

        if (!value) {
            emailMessage.innerText = '이메일을 입력해 주세요'
            emailMessage.className = 'message error'
        } else if (!emailRegex.test(value)) {
            emailMessage.innerText = '올바른 이메일 형식이 아닙니다'
            emailMessage.className = 'message error'
        } else {
            emailMessage.innerText = '올바른 이메일 형식입니다'
            emailMessage.className = 'message success'
        }
    })

    const agree1 = document.querySelector('input[name="agree1"]')
    const agree2 = document.querySelector('input[name="agree2"]')

    const agreeMessage1 = document.getElementById('agreeMessage1')
    const agreeMessage2 = document.getElementById('agreeMessage2')

    agree1.addEventListener('change', () => {
        if (agree1.checked) {
            agreeMessage1.innerText = ''
        }
    })

    agree2.addEventListener('change', () => {
        if (agree2.checked) {
            agreeMessage2.innerText = ''
        }
    })

    // submit 막기
    const form = document.querySelector("form")

    form.addEventListener("submit", (e) => {

        const emailValue = emailInput.value.trim()
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/

        agreeMessage1.innerText = ''
        agreeMessage2.innerText = ''

        if (!isUsernameChecked) {
            e.preventDefault()
            idMessage.innerText = '아이디 중복 확인을 해주세요'
            idMessage.className = 'message error'
            return
        }

        if (passwordInput.value.length < 8) {
            e.preventDefault()
            passwordMessage.innerText = '8자 이상 입력해 주세요'
            passwordMessage.className = 'message error'
            return
        }

        if (confirmInput.value !== passwordInput.value) {
            e.preventDefault()
            passwordMessage.innerText = '비밀번호가 일치하지 않습니다'
            return
        }

        if (!emailRegex.test(emailValue)) {
            e.preventDefault()
            emailMessage.innerText = '올바른 이메일을 입력해 주세요'
            emailMessage.className = 'message error'
        }

        if (!agree1.checked) {
            e.preventDefault()
            agreeMessage1.innerText = '필수 약관에 동의해 주세요'
            return
        }

        agree1.addEventListener('change', () => {
            if (agree1.checked) {
                agreeMessage1.innerText = ''
            }
        })

        if (!agree2.checked) {
            e.preventDefault()
            agreeMessage2.innerText = '필수 약관에 동의해 주세요'
            return
        }

        agree2.addEventListener('change', () => {
            if (agree2.checked) {
                agreeMessage2.innerText = ''
            }
        })
    })
</script>

</body>
</html>
