<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>마이페이지 - Hide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: {
                    colors: { primary: '#111111', surface: '#F5F5F0' },
                    borderRadius: { card: '1.25rem', button: '0.75rem' }
                }}
        }
    </script>
</head>
<body class="min-h-screen bg-[#F5F5F0] pb-20"
      style="font-family: system-ui, sans-serif; max-width: 430px; margin: 0 auto;">

<header class="bg-white border-b-2 border-[#111] px-5 py-3 sticky top-0 z-10">
    <span class="text-lg font-bold text-[#111] tracking-tight">HIDE</span>
</header>

<div class="p-4 space-y-4">
    <div class="bg-white rounded-[1.25rem] overflow-hidden border border-gray-100 shadow-sm">
        <div class="bg-[#F0EDE8] flex items-center justify-center" style="aspect-ratio: 3/4;">
            <img th:if="${avatarUrl}" th:src="${avatarUrl}" alt="아바타"
                 class="w-full h-full object-cover object-top"/>
            <span th:unless="${avatarUrl}" style="font-size: 5rem;">👤</span>
        </div>
        <div class="p-4">
            <h2 class="text-xl font-bold text-[#111]" th:text="|${nickname}, ${age}|">민수, 26</h2>
            <p class="text-sm text-gray-600 mt-1 flex items-center gap-1">
                <span>💬</span>
                <span th:text="${intro}">새로운 사람들과 대화하는 것을 좋아해요.</span>
            </p>
            <p class="text-sm text-gray-500 mt-1 flex items-center gap-1">
                <span>📍</span>
                <span th:text="${region}">서울, 강남구</span>
            </p>
            <div class="flex flex-wrap gap-2 mt-3">
          <span th:each="tag : ${interests}"
                class="px-3 py-1 bg-[#F5F5F0] rounded-full text-xs text-[#111] font-medium"
                th:text="'#' + ${tag}">#음악</span>
            </div>
        </div>
    </div>

    <div class="bg-white rounded-[1.25rem] overflow-hidden border border-gray-100 shadow-sm">
        <a href="/mypage/edit"
           class="flex items-center justify-between px-4 py-4 border-b border-gray-100 hover:bg-[#F5F5F0] transition-colors">
            <span class="text-sm text-[#111] font-medium">프로필 수정</span>
            <span class="text-gray-400 text-lg">›</span>
        </a>
        <a href="/support"
           class="flex items-center justify-between px-4 py-4 border-b border-gray-100 hover:bg-[#F5F5F0] transition-colors">
            <span class="text-sm text-[#111] font-medium">고객지원</span>
            <span class="text-gray-400 text-lg">›</span>
        </a>
        <form method="post" action="/mypage/logout">
            <button type="submit"
                    class="w-full flex items-center justify-between px-4 py-4 hover:bg-[#F5F5F0] transition-colors text-left">
                <span class="text-sm text-red-500 font-medium">로그아웃</span>
                <span class="text-gray-400 text-lg">›</span>
            </button>
        </form>
    </div>
</div>

<nav class="fixed bottom-0 bg-white border-t-2 border-[#111] flex justify-around items-center h-16"
     style="max-width: 430px; width: 100%; left: 50%; transform: translateX(-50%);">
    <a href="/main" class="flex flex-col items-center gap-0.5 py-2 text-gray-400 hover:text-[#111] flex-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span class="text-xs">홈</span>
    </a>
    <a href="/messages" class="flex flex-col items-center gap-0.5 py-2 text-gray-400 hover:text-[#111] flex-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <span class="text-xs">메시지</span>
    </a>
    <a href="/mypage" class="flex flex-col items-center gap-0.5 py-2 text-[#111] flex-1">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span class="text-xs font-semibold">프로필</span>
    </a>
</nav>
</body>
</html>
