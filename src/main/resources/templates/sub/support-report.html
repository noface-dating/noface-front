<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 사용자 신고')}"></head>
<body>
<div class="app-root">
  <header class="page-header">
    <button type="button" onclick="HideApp.goBack()" class="back-btn" aria-label="뒤로">←</button>
    <h1>사용자 신고</h1>
  </header>
  <form id="reportForm" class="p-4 max-w-md mx-auto py-6 space-y-4">
    <div>
      <label class="form-label">신고 사유</label>
      <select class="form-input">
        <option value="">선택하세요</option>
        <option value="spam">스팸/광고</option>
        <option value="harass">허위/욕설</option>
        <option value="other">기타</option>
      </select>
    </div>
    <div>
      <label class="form-label">상세 내용 (선택)</label>
      <textarea rows="4" class="form-input" placeholder="구체적인 사유를 적어 주세요."></textarea>
    </div>
    <button type="submit" class="btn btn-primary">신고 접수</button>
  </form>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
document.getElementById('reportForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('신고가 접수되었습니다');
  location.href='/support';
});
</script>
</body>
</html>
