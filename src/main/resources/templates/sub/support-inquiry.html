<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('HIDE - 문의하기')}"></head>
<body>
<div class="app-root">
  <header class="page-header">
    <button type="button" onclick="HideApp.goBack()" class="back-btn" aria-label="뒤로">←</button>
    <h1>문의하기</h1>
  </header>
  <form id="inquiryForm" class="p-4 max-w-md mx-auto py-6 space-y-4">
    <div>
      <label class="form-label">문의 내용</label>
      <textarea rows="6" class="form-input" placeholder="문의하실 내용을 자세히 적어 주세요." required></textarea>
    </div>
    <button type="submit" class="btn btn-primary">문의 보내기</button>
  </form>
</div>
<div th:replace="~{fragments/layout :: scripts}"></div>
<script>
document.getElementById('inquiryForm').addEventListener('submit', function(e){
  e.preventDefault();
  alert('문의가 접수되었습니다');
  location.href='/support';
});
</script>
</body>
</html>
