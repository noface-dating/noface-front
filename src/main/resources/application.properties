spring.application.name=duri-front
spring.profiles.active=${ACTIVE_PROFILE:dev}

# JWT (???)
jwt.issuer=duri-auth
jwt.public-key=${JWT_PUBLIC_KEY}

# Cookie (???)
web.cookie.domain=
web.cookie.access-path=/
web.cookie.access-max-age=86400

# MariaDB
spring.datasource.url=jdbc:mariadb://${MARIA_HOST}:${MARIA_PORT}/${MARIA_DB}
spring.datasource.username=${MARIA_USERNAME}
spring.datasource.password=${MARIA_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.properties.hibernate.jdbc.timezone=Asia/Seoul

# optional: 로컬에 파일이 없어도 기동됨. ../duriDevelopBack/… 는 같은 상위 폴더에 백엔드가 있을 때 키 공유용
spring.config.import=optional:file:./application-secret.properties,optional:file:./noface-front/application-secret.properties,optional:file:../duriDevelopBack/application-secret.properties
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
app.storage.root=./storage
openai.avatar.edit-model=gpt-image-1
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
