server.port=8080

# Gateway Server URL
gateway.server.url=http://localhost:9050

# JPA Setting
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Local DEV DB Connection
spring.datasource.url=${MARIADB_LOCAL_URL}
spring.datasource.username=${MARIADB_LOCAL_USERNAME}
spring.datasource.password=${MARIADB_LOCAL_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JWT
jwt.issuer=duri-auth
jwt.public-key=${JWT_PUBLIC_KEY}

# Cookie
web.cookie.domain=localhost
web.cookie.is-secure=false
web.cookie.same-site=Lax
web.cookie.access-path=/
web.cookie.access-max-age=86400

# Eureka
eureka.client.service-url.defaultZone=http://admin:1234@localhost:8761/eureka
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false